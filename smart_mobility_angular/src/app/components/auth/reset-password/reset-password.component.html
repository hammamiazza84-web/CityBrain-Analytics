<div class="reset-password-container">
  <div class="reset-password-card">
    <h1>Réinitialisation du mot de passe</h1>
    <p *ngIf="!error && !info">Entrez un nouveau mot de passe pour votre compte.</p>
    <div *ngIf="error" class="alert-error">{{ error }}</div>
    <div *ngIf="info" class="alert-success">{{ info }}</div>

    <div class="form-group">
      <label>Nouveau mot de passe</label>
      <input type="password" [(ngModel)]="password" placeholder="••••••••" />
    </div>

    <div class="form-group">
      <label>Confirmer le mot de passe</label>
      <input type="password" [(ngModel)]="confirmPassword" placeholder="••••••••" />
    </div>

    <button class="btn-primary" (click)="resetPassword()" [disabled]="loading || !!info">
      <span *ngIf="loading">En cours...</span>
      <span *ngIf="!loading">Réinitialiser</span>
    </button>

    <button class="btn-secondary" (click)="goToLogin()" type="button">
      Retour à la connexion
    </button>
  </div>
</div>
